# Drop-in for ludus.service: re-apply the WireGuard callback default after every
# `ludus-server --update` (which re-extracts /opt/ludus/ansible and restarts
# ludus) and on every boot.
#
# Install to /etc/systemd/system/ludus.service.d/10-wg-callbacks.conf, then run
# `systemctl daemon-reload`. (install.sh does both.)
#
# The prefix characters on the path matter:
#   +  run as root, bypassing the service sandbox (ProtectSystem=strict,
#      ReadWritePaths=/opt/ludus, User=ludus) so it can write the file
#   -  ignore the command's exit status, so a missing or failing script can never
#      stop ludus from starting
[Service]
ExecStartPre=-+/usr/local/sbin/ludus-wg-callbacks.sh
